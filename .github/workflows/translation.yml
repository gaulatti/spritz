name: Translation lifecycle

on:
  pull_request:
  push:
    branches: [main]

jobs:
  translation-e2e:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: integration-test-only
      TRANSLATION_WORKER_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated WordPress
        run: docker compose up --build -d --wait
      - name: Run durable translation lifecycle
        run: |
          docker compose cp tests/translation-e2e.php wordpress:/tmp/translation-e2e.php
          docker compose exec -T wordpress wp eval-file /tmp/translation-e2e.php --path=/var/www/html/wordpress --allow-root
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down test services
        if: always()
        run: docker compose down --volumes
